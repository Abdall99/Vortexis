<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="siteTitle">Vortexis | الأنسجة والحبال الصناعية والاستيراد والتصدير</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #070d14; --card-bg: #0d1722; --card-border: #1a2938; --gold-primary: #f59e0b; --gold-bright: #fbbf24; --text-white: #ffffff; --text-gray: #94a3b8; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-dark); color: var(--text-white); margin: 0; padding-bottom: 60px; direction: rtl; }
        .announcement-bar { background: linear-gradient(90deg, var(--gold-primary), var(--gold-bright)); color: #000; text-align: center; padding: 8px; font-weight: 800; font-size: 0.85rem; }
        header { background: #0b1521; border-bottom: 1px solid var(--card-border); padding: 15px; display: flex; align-items: center; justify-content: space-between; max-width: 650px; margin: 0 auto; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .brand-title { color: var(--gold-primary); font-size: 1.4rem; font-weight: 900; margin: 0; letter-spacing: 1px; }
        .brand-sub { color: var(--text-gray); font-size: 0.75rem; }
        .nav-tabs { display: flex; background: var(--card-bg); border-bottom: 1px solid var(--card-border); max-width: 650px; margin: 0 auto 15px; overflow-x: auto; }
        .nav-btn { flex: 1; padding: 12px 8px; background: transparent; border: none; color: var(--text-gray); font-weight: 800; font-size: 0.8rem; cursor: pointer; font-family: inherit; border-bottom: 2px solid transparent; white-space: nowrap; text-align: center; }
        .nav-btn.active { color: var(--gold-bright); border-bottom-color: var(--gold-primary); background: rgba(245, 158, 11, 0.05); }
        .container { max-width: 650px; margin: 0 auto; padding: 0 15px; }
        .page-view { display: none; }
        .page-view.active { display: block; }
        .showroom-banner { background: linear-gradient(rgba(7,13,20,0.7), rgba(7,13,20,0.85)), url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=800') center/cover; border: 1px solid var(--card-border); border-radius: 16px; padding: 25px 15px; text-align: center; margin-bottom: 15px; }
        .showroom-banner h2 { color: var(--gold-bright); margin: 0 0 8px 0; font-size: 1.4rem; font-weight: 900; }
        .showroom-banner p { color: var(--text-gray); font-size: 0.85rem; margin: 0; }
        .search-box { position: relative; margin-bottom: 12px; }
        .search-box input { width: 100%; padding: 12px 40px 12px 15px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; color: var(--text-white); font-family: inherit; box-sizing: border-box; font-size: 0.9rem; }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--gold-primary); }
        .filter-section { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; margin-bottom: 15px; }
        .category-buttons { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .btn-cat { background: var(--bg-dark); border: 1px solid var(--card-border); color: var(--text-gray); padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .btn-cat.active { background: var(--gold-primary); color: #000; border-color: var(--gold-bright); }
        .catalog { display: flex; flex-direction: column; gap: 15px; }
        .card, .trade-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .card-img { width: 100%; height: 210px; object-fit: cover; background: #000; border-radius: 10px; }
        .title, .trade-title { font-size: 1.15rem; font-weight: 800; color: var(--gold-bright); margin: 10px 0 6px 0; }
        .specs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        .spec-item { background: var(--bg-dark); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--card-border); font-size: 0.78rem; color: var(--text-gray); }
        .product-desc { background: var(--bg-dark); padding: 10px; border-radius: 8px; border: 1px solid var(--card-border); font-size: 0.83rem; color: var(--text-gray); margin-bottom: 10px; line-height: 1.5; }
        .action-buttons { display: flex; gap: 8px; }
        .btn-whatsapp-direct { flex: 1; background: #25d366; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 0.88rem; text-decoration: none; }
        .btn-share { background: var(--bg-dark); border: 1px solid var(--card-border); color: var(--gold-bright); padding: 10px 14px; border-radius: 8px; cursor: pointer; }
        .shipping-country-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 15px; margin-bottom: 15px; }
        .shipping-country-title { color: var(--gold-bright); font-size: 1.1rem; font-weight: 800; margin-bottom: 8px; }
        .map-box { width: 100%; height: 180px; border-radius: 10px; border: 1px solid var(--card-border); margin-top: 8px; background: #000; }
    </style>
</head>
<body>
    <div class="announcement-bar"><i class="fa-solid fa-bullhorn"></i> <span id="announcementText">أهلاً بكم في Vortexis - توريد وتصدير الحبال والأنسجة والسفايف والخيوط للجملة!</span></div>
    
    <header>
        <div>
            <h1 class="brand-title" id="headerBrandTitle">Vortexis</h1>
            <div class="brand-sub" id="headerBrandSub">Trading — للتجارة والاستيراد والتصدير (بإدارة أبناء الحاج محمود دوارة)</div>
        </div>
    </header>

    <div class="nav-tabs" id="mainNavTabs"></div>
    <div class="container"><div id="pagesContainer"></div></div>

    <script>
        let SALES_WHATSAPP_PHONE = localStorage.getItem('sales_phone') || "963995869501"; 
        let SALES_MANAGER_NAME = localStorage.getItem('sales_manager') || "مدير قسم المبيعات: عبد الله دوارة";
        let SALES_BTN_TEXT = localStorage.getItem('sales_btn_text') || "طلب وتواصل مباشر عبر الواتساب";

        let EXPORT_WHATSAPP_PHONE = localStorage.getItem('export_phone') || "963952172658"; 
        let EXPORT_MANAGER_NAME = localStorage.getItem('export_manager') || "مدير قسم الاستيراد والتصدير: محمد دوارة";
        let EXPORT_BTN_TEXT = localStorage.getItem('export_btn_text') || "طلب استفسار وتصدير";

        let factoryMapUrl = localStorage.getItem('factory_map') || "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d51590.2312!2d37.1343!3d36.2021!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzDCsDEyJzA3LjgiTiAzN8KwMDgnMDMuNSJF!5e0!3m2!1sar!2s!4v1650000000000";
        let warehouseMapUrl = localStorage.getItem('warehouse_map') || "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d26450.12!2d33.5138!3d36.2765!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzPCsDMwJzQ5LjciTiAzNsKwMTYnMzUuNCJF!5e0!3m2!1sar!2s!4v1650000000000";

        let mainTabs = JSON.parse(localStorage.getItem('saved_mainTabs')) || [
            { id: 'catalogPage', name: 'كتالوج المنتجات والجملة', type: 'catalog', icon: 'fa-boxes-stacked' },
            { id: 'tradePage', name: 'الاستيراد والتصدير', type: 'trade', icon: 'fa-plane-ship' },
            { id: 'shippingPage', name: 'خيارات الاستلام والشحن', type: 'shipping', icon: 'fa-truck-fast' },
            { id: 'mapPage', name: 'مواقع المعمل والمستودعات', type: 'custom', icon: 'fa-map-location-dot' }
        ];

        let categories = JSON.parse(localStorage.getItem('saved_categories')) || [
            { id: 'all', name: 'الكل' }, 
            { id: 'nylon', name: 'حبال نايلون' }, 
            { id: 'flat', name: 'سفايف وأحزمة مسطحة' },
            { id: 'threads', name: 'خيوط وألياف صناعيةخام' }
        ];

        let products = JSON.parse(localStorage.getItem('saved_products')) || [
            { id: 1, target: 'catalogPage', title: 'حبل نايلون مجدول صناعي عالي المتانة', cat: 'nylon', size: '8mm - 24mm', color: 'أصفر / أبيض', media: 'https://images.unsplash.com/photo-1605218403815-681966a3d6a0?w=600', desc: 'حبال نايلون وبولي بروبيلين متينة ومقاومة للرطوبة والأحمال الشاقة للورش والمقاولات والشحن.' },
            { id: 2, target: 'catalogPage', title: 'سفايف وأحزمة تربيط شاحنات (Lashing Straps)', cat: 'flat', size: '35mm - 50mm - 75mm', color: 'أزرق / برتقالي', media: 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=600', desc: 'سفايف وأشرطة مسطحة قوية لتثبيت الحمولات والبضائع أثناء النقل البري والشحن الخارجي.' },
            { id: 3, target: 'tradePage', title: 'خيوط وألياف صناعية خيش للتصدير والجملة', cat: 'threads', size: 'حسب طلب المعامل', color: 'خام وطبيعي', media: 'https://images.unsplash.com/photo-1578575437130-527eed3abbec?w=600', desc: 'استيراد وتصدير ألياف وخيوط صناعية وأنسجة خام لمصانع الحبال والورش بالحاويات المباشرة.' }
        ];

        let shippingDestinations = [
            { country: 'استلام محلي في سوريا 🇸🇾', route: 'استلام مباشر أو شحن داخلي للمحافظات (حلب، دمشق، حمص، حماة، اللاذقية، طرطوس...)', delivery: 'تغطية كاملة للمحافظات والورش', notes: 'تجهيز الشحنات واللفائف للبضائع بالكميات المطلوبة.' },
            { country: 'شحن وتصدير إلى العراق 🇮🇶', route: 'شحن بري تجاري وحاويات (عبر المعابر الحدودية ومراكز التجميع في حلب ودمشق)', delivery: 'وصول إلى بغداد، أربيل، والبصرة', notes: 'تنسيق الحمولات الكبيرة والطلبيات عبر مكاتب الشحن الدولية المعتمدة.' },
            { country: 'شحن إلى لبنان ودول الجوار 🇱🇧 🇯🇴 🇸🇦', route: 'شحن بري وسريع للطرود التجارية وحمولات الأنسجة والحبال والسفايف', delivery: 'تغطية المراكز التجارية والشركاء', notes: 'تسهيل كافة إجراءات الشحن البري والترانزيت.' }
        ];

        let selectedCat = 'all';

        window.onload = function() {
            if(localStorage.getItem('company_name')) document.getElementById('headerBrandTitle').innerText = localStorage.getItem('company_name');
            if(localStorage.getItem('company_sub')) document.getElementById('headerBrandSub').innerText = localStorage.getItem('company_sub');
            if(localStorage.getItem('announcement_text')) document.getElementById('announcementText').innerText = localStorage.getItem('announcement_text');
            renderApp();
        };

        function shareProduct(title) {
            let shareText = `منتج من شركة Vortexis: ${title} -${window.location.href}`;
            if (navigator.share) { navigator.share({ title: 'Vortexis', text: shareText }).catch(() => {}); }
            else { prompt('انسخ رابط المنتج:', shareText); }
        }

        function switchPage(pageId, btnEl) {
            document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
            let targetView = document.getElementById(pageId);
            if(targetView) targetView.classList.add('active');
            if(btnEl) { document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); btnEl.classList.add('active'); }
        }

        function renderApp() {
            let navContainer = document.getElementById('mainNavTabs');
            let pagesContainer = document.getElementById('pagesContainer');
            navContainer.innerHTML = '';
            pagesContainer.innerHTML = '';

            mainTabs.forEach((tab, idx) => {
                let btn = document.createElement('button');
                btn.className = `nav-btn ${idx === 0 ? 'active' : ''}`;
                btn.innerHTML = `<i class="fa-solid ${tab.icon \vert{}\vert{} 'fa-folder'}"></i> ${tab.name}`;
                btn.onclick = (e) => switchPage(tab.id, e.currentTarget);
                navContainer.appendChild(btn);

                let pageDiv = document.createElement('div');
                pageDiv.id = tab.id;
                pageDiv.className = `page-view ${idx === 0 ? 'active' : ''}`;

                if (tab.type === 'catalog') {
                    pageDiv.innerHTML = `
                        <div class="showroom-banner">
                            <h2>Vortexis — الحبال والأنسجة والسفايف</h2>
                            <p>توريد واستيراد كافة أنواع الحبال النايلون، السفايف، الخيوط والأنسجة بالجملة</p>
                        </div>
                        <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" class="searchInputClass" oninput="renderProducts()" placeholder="ابحث عن منتج، مقاس، أو خامة..."></div>
                        <div class="filter-section"><div class="category-buttons catNavClass"></div></div>
                        <div class="catalog catalogClass"></div>
                        
                        <div class="trade-card" style="margin-top:20px; border-color:var(--gold-primary);">
                            <h3 class="trade-title"><i class="fa-solid fa-user-tie"></i> قسم المبيعات والتوريد المحلي (سوريا والمحافظات)</h3>
                            <p class="product-desc" style="font-weight:bold; color:var(--gold-bright); margin-bottom:8px;">${SALES_MANAGER_NAME}</p>
                            <a href="https://wa.me/${SALES_WHATSAPP_PHONE}" class="btn-whatsapp-direct" target="_blank"><i class="fa-brands fa-whatsapp text-xl"></i> تواصل مع مدير المبيعات عبر الواتساب</a>
                        </div>
                    `;
                } else if (tab.type === 'trade') {
                    pageDiv.innerHTML = `
                        <div class="trade-card">
                            <h3 class="trade-title"><i class="fa-solid fa-plane-ship"></i> ${tab.name}</h3>
                            <p class="product-desc">نختص بتوفير واستيراد وتصدير كافة أنواع الأنسجة، الخيوط، السفايف، الحبال والمواد الأولية بالطلبيات الكبرى والحاويات المباشرة.</p>
                        </div>
                        <div class="tradeProductsListClass"></div>
                        <div class="trade-card" style="border-color:#25d366;">
                            <h3 class="trade-title"><i class="fa-solid fa-headset"></i> قسم الاستيراد والتصدير الدولي (الحاويات والجملة)</h3>
                            <p class="product-desc" style="font-weight:bold; color:var(--gold-bright); margin-bottom:8px;">${EXPORT_MANAGER_NAME}</p>
                            <a href="https://wa.me/${EXPORT_WHATSAPP_PHONE}" class="btn-whatsapp-direct" style="background:#25d366;" target="_blank"><i class="fa-brands fa-whatsapp text-xl"></i> تواصل مع قسم الاستيراد والتصدير عبر الواتساب</a>
                        </div>
                    `;
                } else if (tab.type === 'shipping') {
                    pageDiv.innerHTML = `
                        <div class="trade-card" style="margin-bottom:15px;">
                            <h3 class="trade-title"><i class="fa-solid fa-truck-fast"></i> ${tab.name}</h3>
                            <p class="product-desc">خيارات وطرق الاستلام والشحن البري المعتمدة للبضائع والأنسجة والحبال داخل سوريا وإلى دول الجوار بكل أمان.</p>
                        </div>
                        <div class="shippingDestinationsListClass"></div>
                    `;
                } else {
                    pageDiv.innerHTML = `
                        <div class="trade-card" style="margin-bottom:15px;">
                            <h3 class="trade-title"><i class="fa-solid fa-industry"></i> ${tab.name}</h3>
                            <p class="product-desc">تستطيع زيارة معارضنا ومستودعاتنا الرئيسية للاطلاع على خطوط الإنتاج والإنتاج الفعلي واستلام الحمولات.</p>
                        </div>
                        <div class="trade-card">
                            <h3 class="trade-title"><i class="fa-solid fa-location-dot" style="color:#ef4444;"></i> موقع المعمل الرئيسي (حلب / سوريا)</h3>
                            <p class="product-desc">المنطقة الصناعية - خط الإنتاج والتصنيع الأساسي.</p>
                            <iframe class="map-box" src="${factoryMapUrl}" loading="lazy"></iframe>
                        </div>
                        <div class="trade-card" style="margin-top:15px;">
                            <h3 class="trade-title"><i class="fa-solid fa-warehouse" style="color:var(--gold-bright);"></i> مستودعات الشركة للتسليم والتصدير</h3>
                            <p class="product-desc">مستودعات تجمع الجملة وتجهيز الشحن البري والدولي.</p>
                            <iframe class="map-box" src="${warehouseMapUrl}" loading="lazy"></iframe>
                        </div>
                    `;
                }
                pagesContainer.appendChild(pageDiv);
            });

            renderCategories();
            renderProducts();
        }

        function renderCategories() {
            let catNavs = document.querySelectorAll('.catNavClass');
            catNavs.forEach(catNav => {
                catNav.innerHTML = '';
                categories.forEach(c => {
                    let btn = document.createElement('button');
                    btn.className = `btn-cat ${selectedCat === c.id ? 'active' : ''}`;
                    btn.innerText = c.name;
                    btn.onclick = () => { selectedCat = c.id; renderCategories(); renderProducts(); };
                    catNav.appendChild(btn);
                });
            });
        }

        function renderProducts() {
            let searchInputEl = document.querySelector('.searchInputClass');
            let searchVal = searchInputEl ? searchInputEl.value.trim().toLowerCase() : '';

            mainTabs.forEach(tab => {
                if(tab.type === 'catalog') {
                    let catalogEl = document.querySelector(`#${tab.id} .catalogClass`);
                    if(!catalogEl) return;
                    catalogEl.innerHTML = '';

                    let tabProds = products.filter(p => p.target === tab.id);
                    let filteredCatalog = selectedCat === 'all' ? tabProds : tabProds.filter(p => p.cat === selectedCat);
                    if (searchVal) filteredCatalog = filteredCatalog.filter(p => p.title.toLowerCase().includes(searchVal));

                    filteredCatalog.forEach(p => {
                        let waMsg = encodeURIComponent(`السلام عليكم، استفسار عن المنتج من شركة Vortexis:\n- المنتج: *${p.title}*\n- المقاس: ${p.size}\n- النوع/اللون: ${p.color}`);
                        let card = document.createElement('div'); card.className = 'card';
                        card.innerHTML = `
                            <img src="${p.media}" class="card-img">
                            <h3 class="title">${p.title}</h3>
                            <div class="specs"><span class="spec-item">المقاس: ${p.size}</span><span class="spec-item">اللون: ${p.color}</span></div>
                            <div class="product-desc">${p.desc}</div>
                            <div class="action-buttons">
                                <a href="https://wa.me/${SALES_WHATSAPP_PHONE}?text=${waMsg}" class="btn-whatsapp-direct" target="_blank"><i class="fa-brands fa-whatsapp text-lg"></i> ${SALES_BTN_TEXT}</a>
                                <button class="btn-share" onclick="shareProduct('${p.title}')"><i class="fa-solid fa-share-nodes"></i></button>
                            </div>
                        `;
                        catalogEl.appendChild(card);
                    });
                } else if(tab.type === 'trade') {
                    let tradeEl = document.querySelector(`#${tab.id} .tradeProductsListClass`);
                    if(!tradeEl) return;
                    tradeEl.innerHTML = '';
                    let tabProds = products.filter(p => p.target === tab.id);
                    if (searchVal) tabProds = tabProds.filter(p => p.title.toLowerCase().includes(searchVal));
                    
                    tabProds.forEach(p => {
                        let waMsgExport = encodeURIComponent(`السلام عليكم، استفسار من شركة Vortexis:\n- الطلب: *${p.title}*`);
                        let card = document.createElement('div'); card.className = 'trade-card';
                        card.innerHTML = `
                            <img src="${p.media}" class="card-img">
                            <h3 class="trade-title">${p.title}</h3>
                            <div class="specs"><span class="spec-item">المقاس: ${p.size}</span><span class="spec-item">اللون: ${p.color}</span></div>
                            <div class="product-desc">${p.desc}</div>
                            <div class="action-buttons">
                                <a href="https://wa.me/${EXPORT_WHATSAPP_PHONE}?text=${waMsgExport}" class="btn-whatsapp-direct" style="background:#25d366;" target="_blank"><i class="fa-brands fa-whatsapp text-lg"></i> ${EXPORT_BTN_TEXT}</a>
                                <button class="btn-share" onclick="shareProduct('${p.title}')"><i class="fa-solid fa-share-nodes"></i></button>
                            </div>
                        `;
                        tradeEl.appendChild(card);
                    });
                } else if(tab.type === 'shipping') {
                    let shippingEl = document.querySelector(`#${tab.id} .shippingDestinationsListClass`);
                    if(!shippingEl) return;
                    shippingEl.innerHTML = '';
                    shippingDestinations.forEach(dest => {
                        let sCard = document.createElement('div'); sCard.className = 'shipping-country-card';
                        sCard.innerHTML = `
                            <div class="shipping-country-title">${dest.country}</div>
                            <div class="product-desc" style="margin-bottom:8px;"><b>طريقة التسليم والشحن:</b> ${dest.route}</div>
                            <div class="product-desc" style="margin-bottom:8px;"><b>نطاق الوصول:</b> ${dest.delivery}</div>
                            <div style="background:var(--bg-dark); padding:8px; border-radius:6px; font-size:0.8rem; color:var(--gold-bright);">💡 ${dest.notes}</div>
                        `;
                        shippingEl.appendChild(sCard);
                    });
                }
            });
        }
    </script>
</body>
</html>
